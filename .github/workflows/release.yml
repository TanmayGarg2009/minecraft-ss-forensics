name: Release Standalone Windows Scanner

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Standalone Windows Scanner
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/MinecraftSsForensics.sln

      - name: Run Forensic Test Suite (79 Automated Verification Tests)
        run: dotnet test backend/MinecraftSsForensics.sln --configuration Release --verbosity normal

      - name: Publish Scanner Standalone Executable
        run: >
          dotnet publish backend/src/MinecraftSsForensics.Scanner.App/MinecraftSsForensics.Scanner.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output dist

      - name: Publish Viewer Standalone Executable
        run: >
          dotnet publish backend/src/MinecraftSsForensics.Viewer.App/MinecraftSsForensics.Viewer.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output dist

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          if (Test-Path "dist/MinecraftSsForensics.Scanner.App.exe") {
            Move-Item "dist/MinecraftSsForensics.Scanner.App.exe" "dist/MinecraftSsForensics.exe" -Force
          }
          $hashScanner = (Get-FileHash dist/MinecraftSsForensics.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hashScanner  MinecraftSsForensics.exe" | Out-File -FilePath dist/MinecraftSsForensics.exe.sha256 -Encoding utf8

          $hashViewer = (Get-FileHash dist/MinecraftSsForensics.Viewer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hashViewer  MinecraftSsForensics.Viewer.exe" | Out-File -FilePath dist/MinecraftSsForensics.Viewer.exe.sha256 -Encoding utf8

          "$hashScanner  MinecraftSsForensics.exe`n$hashViewer  MinecraftSsForensics.Viewer.exe" | Out-File -FilePath dist/checksums.sha256 -Encoding utf8

          Write-Host "Published Scanner SHA-256: $hashScanner"
          Write-Host "Published Viewer SHA-256:  $hashViewer"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/MinecraftSsForensics.exe
            dist/MinecraftSsForensics.exe.sha256
            dist/MinecraftSsForensics.Viewer.exe
            dist/MinecraftSsForensics.Viewer.exe.sha256
            dist/checksums.sha256
            launch.ps1
          generate_release_notes: true
          draft: false
          prerelease: false
